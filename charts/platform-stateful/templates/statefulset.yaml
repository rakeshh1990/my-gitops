apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ .Values.workload.name }}
  namespace: {{ .Values.namespace }}

spec:
  serviceName: {{ .Values.workload.name }}

  replicas: {{ .Values.workload.replicas }}

  revisionHistoryLimit: {{ .Values.workload.revisionHistoryLimit | default 3 }}

  podManagementPolicy: {{ .Values.workload.podManagementPolicy }}

  updateStrategy:
    type: {{ .Values.workload.updateStrategy }}

  selector:
    matchLabels:
      app: {{ .Values.workload.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.workload.name }}

    spec:
{{- if .Values.securityContext.enabled }}
      securityContext:
        {{ toYaml .Values.securityContext.spec | nindent 8 }}
{{- end }}
{{- if .Values.initContainers }}
      initContainers:
{{ toYaml .Values.initContainers | nindent 6 }}
{{- end }}
      
      containers:
      - name: {{ .Values.workload.name }}
        image: "{{ .Values.workload.image.repository }}:{{ .Values.workload.image.tag }}"
        imagePullPolicy: {{ .Values.workload.image.pullPolicy }}
{{- if .Values.workload.command }}
        command:
{{ toYaml .Values.workload.command | nindent 10 }}
{{- end }}
{{- if .Values.workload.args }}
        args:
{{ toYaml .Values.workload.args | nindent 10 }}
{{- end }}
        ports:
{{- if .Values.service.ports }}
{{- range .Values.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
{{- end }}
{{- else }}
        - containerPort: {{ .Values.workload.containerPort }}
{{- end }}

        envFrom:
{{- if .Values.secret.enabled }}
        - secretRef:
            name: {{ .Values.workload.name }}
{{- end }}

{{- if .Values.configMap.enabled }}
          - configMapRef:
              name: {{ .Values.workload.name }}
{{- end }}

{{- if .Values.workload.resources }}
        resources:
          {{ toYaml .Values.workload.resources | nindent 10 }}
{{- end }}
{{- if .Values.probes.enabled }}

{{- if .Values.probes.startup.enabled }}
        startupProbe:
{{ toYaml .Values.probes.startup.spec | nindent 10 }}
{{- end }}


{{- if .Values.probes.readiness.enabled }}
        readinessProbe:
{{ toYaml .Values.probes.readiness.spec | nindent 10 }}
{{- end }}


{{- if .Values.probes.liveness.enabled }}
        livenessProbe:
{{ toYaml .Values.probes.liveness.spec | nindent 10 }}
{{- end }}

{{- end }}
{{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: {{ .Values.persistence.name | default "data" }}
          mountPath: {{ .Values.persistence.mountPath }}
{{- end }}
{{- if .Values.persistence.enabled }}

  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.persistence.name | default "data" }}

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: {{ .Values.persistence.size }}

      storageClassName: {{ .Values.persistence.storageClass }}

{{- end }}