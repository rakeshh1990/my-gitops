apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.workload.name }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.workload.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.workload.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.workload.name }}

    spec:

{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | nindent 8 }}
{{- end }}

{{- if .Values.securityContext.enabled }}
      securityContext:
{{ toYaml .Values.securityContext.spec | nindent 8 }}
{{- end }}

{{- if .Values.initContainers }}
      initContainers:
{{ toYaml .Values.initContainers | nindent 8 }}
{{- end }}

      containers:
      - name: {{ .Values.workload.name }}

        image: "{{ .Values.workload.image.repository }}:{{ .Values.workload.image.tag }}"
        imagePullPolicy: {{ .Values.workload.image.pullPolicy | default "IfNotPresent" }}

{{- if .Values.workload.command }}
        command:
{{ toYaml .Values.workload.command | nindent 10 }}
{{- end }}

{{- if .Values.workload.args }}
        args:
{{ toYaml .Values.workload.args | nindent 10 }}
{{- end }}

        ports:
{{- range .Values.workload.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
{{- end }}

        envFrom:

{{- if (include "platform.secret.enabled" .) }}
        - secretRef:
            name: platform-secret
{{- end }}

{{- if .Values.secret.enabled }}
        - secretRef:
            name: {{ .Values.workload.name }}
{{- end }}

{{- if .Values.configMap.enabled }}
        - configMapRef:
            name: {{ .Values.workload.name }}
{{- end }}

{{- $platformEnv := include "platform.env" . }}

{{- if $platformEnv }}
        env:
{{- $platformEnv | nindent 8 }}
{{- end }}

{{- if .Values.workload.resources }}
        resources:
{{ toYaml .Values.workload.resources | nindent 10 }}
{{- end }}

{{- if .Values.probes.enabled }}
        startupProbe:
{{ toYaml .Values.probes.startupProbe | nindent 10 }}

        readinessProbe:
{{ toYaml .Values.probes.readinessProbe | nindent 10 }}

        livenessProbe:
{{ toYaml .Values.probes.livenessProbe | nindent 10 }}
{{- end }}

{{- if .Values.extraVolumeMounts }}
        volumeMounts:
{{ toYaml .Values.extraVolumeMounts | nindent 10 }}
{{- end }}

{{- if .Values.extraVolumes }}
      volumes:
{{ toYaml .Values.extraVolumes | nindent 8 }}
{{- end }}

{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | nindent 8 }}
{{- end }}

{{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | nindent 8 }}
{{- end }}

{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | nindent 8 }}
{{- end }}