apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: vault

spec:
  provider:
    vault:
      server: http://vault.platform.svc.cluster.local:8200
      path: applications
      version: v2

      auth:
        kubernetes:
          mountPath: kubernetes
          role: stock-alert

          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets