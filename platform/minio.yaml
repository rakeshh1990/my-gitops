apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: minio
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rakeshh1990/my-gitops.git
    targetRevision: main
    path: charts/minio

    helm:
      valueFiles:
        - ../../values/platform/minio.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true