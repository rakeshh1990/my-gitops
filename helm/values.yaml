# Default values for code-agent Helm chart

# Global settings
global:
  namespace: ai-assistant

# Docker registry configuration
registry:
  type: ghcr  # 'ghcr' or 'dockerhub'
  ghcr:
    url: ghcr.io
    username: ""
    token: ""
  dockerhub:
    url: docker.io
    username: ""
    token: ""

# Ollama configuration
ollama:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 11434
    targetPort: 11434
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
    mountPath: /root/.ollama
  
  model: qwen2.5-coder:7b
  
  env:
    OLLAMA_KEEP_ALIVE: "24h"
    OLLAMA_NUM_PARALLEL: "2"

# Assistant configuration
assistant:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/rakeshh1990/my-ai-agent  # Update with your repo
    tag: 6c02fbf
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: assistant.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    mountPath: /data
  
  env:
    OLLAMA_URL: http://ollama:11434
    MODEL: qwen2.5-coder:7b
    NODE_ENV: production
  
  config:
    SESSION_FILE: /data/memory.json

# Global replica count
replicaCount: 1

# Node affinity (optional, for local minikube)
nodeSelector: {}

tolerations: []

affinity: {}
