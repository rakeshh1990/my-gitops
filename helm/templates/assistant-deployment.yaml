{{- if .Values.assistant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-assistant
  namespace: {{ .Values.global.namespace }}
  labels:
    app: chat-assistant
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.assistant.replicaCount }}
  selector:
    matchLabels:
      app: chat-assistant
  template:
    metadata:
      labels:
        app: chat-assistant
    spec:
      containers:
      - name: assistant
        image: "{{ .Values.assistant.image.repository }}:{{ .Values.assistant.image.tag }}"
        imagePullPolicy: {{ .Values.assistant.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.assistant.service.targetPort }}
          protocol: TCP
        
        env:
        {{- range $key, $value := .Values.assistant.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        - name: SESSION_FILE
          value: {{ .Values.assistant.config.SESSION_FILE }}
        
        resources:
          requests:
            memory: {{ .Values.assistant.resources.requests.memory }}
            cpu: {{ .Values.assistant.resources.requests.cpu }}
          limits:
            memory: {{ .Values.assistant.resources.limits.memory }}
            cpu: {{ .Values.assistant.resources.limits.cpu }}
        
        {{- if .Values.assistant.persistence.enabled }}
        volumeMounts:
        - name: assistant-data
          mountPath: {{ .Values.assistant.persistence.mountPath }}
        {{- end }}
        
        livenessProbe:
          httpGet:
            path: /api/history
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /api/history
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      
      {{- if .Values.assistant.persistence.enabled }}
      volumes:
      - name: assistant-data
        persistentVolumeClaim:
          claimName: assistant-pvc
      {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: chat-assistant
  namespace: {{ .Values.global.namespace }}
  labels:
    app: chat-assistant
spec:
  type: {{ .Values.assistant.service.type }}
  ports:
  - port: {{ .Values.assistant.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: chat-assistant

{{- if .Values.assistant.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.assistant.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.assistant.persistence.size }}
{{- end }}

{{- if .Values.assistant.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-assistant
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.assistant.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.assistant.ingress.className }}
  ingressClassName: {{ .Values.assistant.ingress.className }}
  {{- end }}
  rules:
  {{- range .Values.assistant.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: chat-assistant
            port:
              number: {{ $.Values.assistant.service.port }}
      {{- end }}
  {{- end }}
  {{- with .Values.assistant.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
