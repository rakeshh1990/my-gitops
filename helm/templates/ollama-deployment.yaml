{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ollama
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.ollama.replicaCount }}
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
        imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.ollama.service.targetPort }}
          protocol: TCP
        
        env:
        {{- range $key, $value := .Values.ollama.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        
        resources:
          requests:
            memory: {{ .Values.ollama.resources.requests.memory }}
            cpu: {{ .Values.ollama.resources.requests.cpu }}
          limits:
            memory: {{ .Values.ollama.resources.limits.memory }}
            cpu: {{ .Values.ollama.resources.limits.cpu }}
        
        {{- if .Values.ollama.persistence.enabled }}
        volumeMounts:
        - name: ollama-data
          mountPath: {{ .Values.ollama.persistence.mountPath }}
        {{- end }}
        
        livenessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        
        readinessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
      
      {{- if .Values.ollama.persistence.enabled }}
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc
      {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: ollama

{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.ollama.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
{{- end }}
