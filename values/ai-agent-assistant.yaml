namespace: ai-agent

workload:
  name: assistant

  replicas: 1

  revisionHistoryLimit: 3

  image:
    repository: ghcr.io/rakeshh1990/my-ai-agent
    tag: main-5c79028
    pullPolicy: Always

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi

  service:
    enabled: true

    type: ClusterIP

    ports:
      - name: http
        port: 80
        targetPort: 3000

  ingress:
    enabled: true

    host: assistant.local

configMap:
  enabled: true

  data:
    - name: OLLAMA_BASE_URL
      value: http://ollama:11434

    - name: FETCH_TIMEOUT_MS
      value: "300000"

secret:
  enabled: false

securityContext:
  enabled: false

initContainers: []

imagePullSecrets: []

extraVolumes: []

extraVolumeMounts: []

nodeSelector: {}

affinity: {}

tolerations: []

probes:
  enabled: true

  startupProbe:
    httpGet:
      path: /
      port: 3000
    failureThreshold: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 3000
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30