namespace: ai-agent

workload:
  name: ollama

  replicas: 1

  image:
    repository: ollama/ollama
    tag: latest

  containerPort: 11434

  initContainers:
    - name: pull-model
      image: ollama/ollama:latest
      command:
        - sh
        - -c
        - |
          ollama serve &

          until ollama list >/dev/null 2>&1; do
            sleep 2
          done

          ollama show qwen2.5-coder:3b >/dev/null 2>&1 || \
            ollama pull qwen2.5-coder:3b
      volumeMounts:
        - name: data
          mountPath: /root/.ollama

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: 2
      memory: 4Gi

  service:
    enabled: true
    port: 11434

  ingress:
    enabled: true
    host: ollama.local

  persistence:
    enabled: true
    mountPath: /root/.ollama
    size: 20Gi

configMap:
  enabled: true
  data:
    - OLLAMA_KEEP_ALIVE=24h # Keep model in RAM for faster response
    - OLLAMA_NUM_PARALLEL=2 # Good for i5 multitasking

extraJob:
  enabled: false