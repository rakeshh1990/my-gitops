namespace: platform

workload:
  name: redpanda
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy: RollingUpdate

  image:
    repository: redpandadata/redpanda
    tag: v25.1.4
    pullPolicy: IfNotPresent

  containerPort: 9092

  command: []

  args:
    - start
    - --overprovisioned
    - --smp
    - "1"
    - --memory
    - "1G"
    - --reserve-memory
    - "0M"
    - --kafka-addr
    - internal://0.0.0.0:9092

    - --advertise-kafka-addr
    - internal://redpanda.platform.svc.cluster.local:9092

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

persistence:
  enabled: true
  size: 20Gi
  storageClass: standard
  mountPath: /var/lib/redpanda/data

service:
  enabled: true
  type: ClusterIP

  ports:
    - name: kafka
      port: 9092
      targetPort: 9092

    - name: schema
      port: 8081
      targetPort: 8081

    - name: pandaproxy
      port: 8082
      targetPort: 8082

    - name: admin
      port: 9644
      targetPort: 9644

configMap:
  enabled: true
  data:
    - name: REDPANDA_AUTO_CREATE_TOPICS
      value: "true"

    - name: REDPANDA_LOG_LEVEL
      value: info

secret:
  enabled: false

securityContext:

  enabled: true

  spec:

    runAsUser: 101
    runAsGroup: 101

    fsGroup: 101

initContainers:

- name: volume-permissions

  image: busybox:1.36

  imagePullPolicy: IfNotPresent


  securityContext:
    runAsUser: 0


  command:
  - sh
  - -c
  - |
    echo "Fixing permissions"

    chown -R 101:101 /var/lib/redpanda/data

    chmod -R ug+rwX /var/lib/redpanda/data

    ls -ld /var/lib/redpanda/data



  volumeMounts:

  - name: data
    mountPath: /var/lib/redpanda/data

probes:

  enabled: true

  startup:
    enabled: true

    spec:

      tcpSocket:
        port: 9092

      failureThreshold: 30
      periodSeconds: 10

  readiness:
    enabled: true

    spec:

      tcpSocket:
        port: 9092

      periodSeconds: 10

  liveness:
    enabled: true

    spec:

      tcpSocket:
        port: 9092

      initialDelaySeconds: 60

      periodSeconds: 30