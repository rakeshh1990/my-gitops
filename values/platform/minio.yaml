minio:
  mode: standalone

  rootUser: admin
  rootPassword: changeme

  persistence:
    enabled: true
    size: 20Gi

  buckets:
    - name: loki-chunks
      policy: none
      purge: false

    - name: loki-ruler
      policy: none
      purge: false

    - name: loki-admin
      policy: none
      purge: false

    - name: tempo
      policy: none
      purge: false

  resources:
    requests:
      memory: 256Mi
      cpu: 100m

    limits:
      memory: 512Mi
      cpu: 500m