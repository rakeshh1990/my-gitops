namespace: platform

workload:
  name: vault
  replicas: 1

  image:
    repository: hashicorp/vault
    tag: "1.20.3"
    pullPolicy: IfNotPresent

  containerPort: 8200

  command:
    - vault

  args:
    - server
    - -config=/vault/config/vault.hcl

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  enabled: true
  type: ClusterIP

  ports:
    - name: http
      port: 8200
      targetPort: 8200

persistence:
  enabled: true
  size: 10Gi
  storageClass: standard
  mountPath: /vault/file

configMap:
  enabled: false

secret:
  enabled: false

ingress:
  enabled: true
  host: vault.local
  servicePort: 8200

probes:
  startup:
    enabled: true
    path: /v1/sys/health
    port: 8200

  readiness:
    enabled: true
    path: /v1/sys/health
    port: 8200

  liveness:
    enabled: true
    path: /v1/sys/health
    port: 8200

extraConfigMaps:
  enabled: true

  items:
    - name: vault-config

      files:

        vault.hcl: |
          ui = true

          listener "tcp" {
            address = "0.0.0.0:8200"
            tls_disable = 1
          }

          storage "file" {
            path = "/vault/file"
          }

          disable_mlock = true

extraVolumes:
  - name: vault-config
    configMap:
      name: vault-config

extraVolumeMounts:
  - name: vault-config
    mountPath: /vault/config