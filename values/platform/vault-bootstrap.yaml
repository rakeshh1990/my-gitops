namespace: platform

workload:
  name: vault-bootstrap

  image:
    repository: hashicorp/vault
    tag: "1.20.3"
    pullPolicy: IfNotPresent

  command:
    - sh

  args:
    - /bootstrap/bootstrap.sh

restartPolicy: Never

backoffLimit: 3

ttlSecondsAfterFinished: 300

serviceAccount:
  create: false

extraConfigMaps:
  enabled: true

  items:
    - name: vault-bootstrap

      files:
        bootstrap.sh: |
          #!/bin/sh

          set -e

          export VAULT_ADDR=http://vault.platform.svc.cluster.local:8200
          export VAULT_TOKEN=$(cat /var/run/secrets/vault/token)

          echo "Waiting for Vault..."

          while true; do

              echo "VAULT_ADDR=$VAULT_ADDR"

              vault status

              echo "------ JSON ------"

              STATUS=$(vault status -format=json)

              echo "$STATUS"

              INITIALIZED=$(vault status -format=json | grep '"initialized"' | awk '{print $2}' | tr -d ',')
              SEALED=$(vault status -format=json | grep '"sealed"' | awk '{print $2}' | tr -d ',')

              echo "INITIALIZED=$INITIALIZED"
              echo "SEALED=$SEALED"

              if [ "$INITIALIZED" != "true" ]; then
                  echo "Vault is not initialized."
                  exit 0
              fi

              if [ "$SEALED" = "true" ]; then
                  echo "Vault is sealed. Waiting..."
                  sleep 5
                  continue
              fi

              break
          done

          echo "Vault is ready."

          echo "=== Enable KV v2 ==="

          vault secrets list | grep "^applications/" >/dev/null 2>&1 || \
          vault secrets enable -path=applications kv-v2

          echo "=== Enable Kubernetes Auth ==="

          vault auth list | grep "^kubernetes/" >/dev/null 2>&1 || \
          vault auth enable kubernetes

          echo "=== Configure Kubernetes Auth ==="

          KUBE_HOST="https://kubernetes.default.svc"

          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

          CA_CERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

          vault write auth/kubernetes/config \
              kubernetes_host="$KUBE_HOST" \
              token_reviewer_jwt="$SA_TOKEN" \
              kubernetes_ca_cert=@"$CA_CERT"

          echo "Kubernetes auth configured."

          echo "=== Create stock-alert policy ==="

          cat >/tmp/stock-alert-policy.hcl <<EOF
          path "applications/data/stock-alert/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }

          path "applications/metadata/stock-alert/*" {
            capabilities = ["list", "read"]
          }
          EOF

          vault policy write stock-alert /tmp/stock-alert-policy.hcl

          echo "Policy configured."

          echo "=== Create stock-alert role ==="

          vault write auth/kubernetes/role/stock-alert \
              bound_service_account_names=external-secrets \
              bound_service_account_namespaces=external-secrets \
              policies=stock-alert \
              ttl=24h

          echo "Role configured."

          echo "Done."

extraVolumes:
  - name: bootstrap
    configMap:
      name: vault-bootstrap
      defaultMode: 0755
  - name: vault-token
    secret:
      secretName: vault-root-token

extraVolumeMounts:
  - name: bootstrap
    mountPath: /bootstrap
    readOnly: true
  - name: vault-token
    mountPath: /var/run/secrets/vault
    readOnly: true

hook:
  type: ""
  deletePolicy: ""