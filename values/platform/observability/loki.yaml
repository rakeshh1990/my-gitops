loki:
  loki:
    deploymentMode: SimpleScalable

    singleBinary:
      replicas: 0

    read:
      replicas: 1

    write:
      replicas: 1

    backend:
      replicas: 1

    gateway:
      enabled: true

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    test:
      enabled: false

    commonConfig:
      replication_factor: 1

    auth_enabled: false

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true

    storage:
      type: s3

      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin

      s3:
        endpoint: minio.observability.svc.cluster.local:9000
        accessKeyId: admin
        secretAccessKey: password
        s3ForcePathStyle: true
        insecure: true

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h