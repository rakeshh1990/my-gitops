loki:
  deploymentMode: Monolithic

  singleBinary:
    enabled: true
    replicas: 1

  read:
    enabled: false

  write:
    enabled: false

  backend:
    enabled: false

  gateway:
    enabled: false

  lokiCanary:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  ruler:
    enabled: false

  test:
    enabled: false

  storage:
    type: filesystem

    bucketNames:
      chunks: filesystem
      ruler: filesystem
      admin: filesystem

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h