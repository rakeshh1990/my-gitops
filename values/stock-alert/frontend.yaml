namespace: stock-alert
workload:
  name: frontend
  replicas: 1
  revisionHistoryLimit: 3
  image:
    repository: ghcr.io/rakeshh1990/stock-alert-frontend
    tag: main-68b430c
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 3000
ingress:
  enabled: true

  host: stock-alert.local

  paths:

    - path: /
      serviceName: frontend
      servicePort: 80

    - path: /api
      serviceName: api-gateway
      servicePort: 8000

configMap:
  enabled: false
secret:
  enabled: false
securityContext:
  enabled: false
initContainers: []
imagePullSecrets: []
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
affinity: {}
tolerations: []
probes:
  enabled: true
  startupProbe:
    httpGet:
      path: /
      port: 3000
    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
serviceAccount:
  enabled: false
