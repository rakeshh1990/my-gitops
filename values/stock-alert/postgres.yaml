namespace: stock-alert

workload:
  name: postgres
  replicas: 1
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  containerPort: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

secret:
  enabled: true
  data:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_DB: postgres

persistence:
  enabled: true
  size: 20Gi
  storageClass: standard
  mountPath: /var/lib/postgresql/data

service:
  type: ClusterIP