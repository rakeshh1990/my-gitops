namespace: stock-alert

workload:
  name: postgres
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy: RollingUpdate
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  containerPort: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

secret:
  enabled: true
  data:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_DB: postgres

configMap:
  enabled: false

postgres:
  users:
    - name: stock
      password: stockpass

persistence:
  enabled: true
  size: 20Gi
  storageClass: standard
  mountPath: /var/lib/postgresql/data

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

probes:

  enabled: true

  readiness:
    enabled: true

    spec:

      exec:

        command:
        - sh
        - -c
        - pg_isready -U postgres

      periodSeconds: 10

  liveness:
    enabled: true

    spec:

      exec:

        command:
        - sh
        - -c
        - pg_isready -U postgres

      periodSeconds: 30