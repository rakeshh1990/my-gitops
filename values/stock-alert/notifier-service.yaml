namespace: stock-alert
workload:
  name: notifier-service
  replicaCount: 1
  image:
    repository: ghcr.io/rakeshh1990/stock-alert-notifier-service
    tag: main-9748f85
  containerPort: 8000
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8004
        targetPort: 8000
configMap:
  enabled: true
  data:
    - name: SERVICE_PORT
      value: "8000"
    - name: KAFKA_BROKER
      value: redpanda:9092
    - name: KAFKA_ALERT_TOPIC
      value: alert.triggered
    - name: KAFKA_NOTIFIER_GROUP
      value: notifier-service
    - name: USER_SERVICE_URL
      value: http://user-service:8002
secret:
  enabled: false
ingress:
  enabled: false
probes:
  startup:
    enabled: true
    path: /health
    port: 8000
  readiness:
    enabled: true
    path: /health
    port: 8000
  liveness:
    enabled: true
    path: /health
    port: 8000
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
