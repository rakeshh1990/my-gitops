namespace: stock-alert
workload:
  name: api-gateway
  replicas: 1
  image:
    repository: ghcr.io/rakeshh1990/stock-alert-api-gateway
    tag: main-c1db506
    pullPolicy: Always
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8000
        targetPort: 8000
ingress:
  enabled: true
  host: stock-alert.local

  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

  paths:
    - path: /api(/|$)(.*)
      pathType: ImplementationSpecific
      serviceName: api-gateway
      servicePort: 8000
configMap:
  enabled: true
  data:
    - name: AUTH_URL
      value: http://auth-service:8001

    - name: USER_URL
      value: http://user-service:8002

    - name: ANALYZER_URL
      value: http://analyzer-service:8003

    - name: NOTIFIER_URL
      value: http://notifier-service:8004

    - name: SCANNER_URL
      value: http://scanner-service:8005
secret:
  enabled: true
  data:
    - name: JWT_SECRET
      value: super-secret
probes:
  enabled: true
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
