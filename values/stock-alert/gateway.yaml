namespace: stock-alert
workload:
  name: api-gateway
  replicas: 1
  image:
    repository: ghcr.io/rakeshh1990/stock-alert-api-gateway
    tag: main-68b430c
    pullPolicy: Always
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    enabled: true
    type: ClusterIP
    ports:
      - name: http
        port: 8000
        targetPort: 8000
ingress:
  enabled: false
configMap:
  enabled: true
  data:
    - name: AUTH_SERVICE_URL
      value: http://auth-service:8001
    - name: USER_SERVICE_URL
      value: http://user-service:8002
    - name: ANALYZER_SERVICE_URL
      value: http://analyzer-service:8003
    - name: SCANNER_SERVICE_URL
      value: http://scanner-service:8004
    - name: NOTIFIER_SERVICE_URL
      value: http://notifier-service:8005
secret:
  enabled: true
  data:
    - name: JWT_SECRET
      value: super-secret
probes:
  enabled: true
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
