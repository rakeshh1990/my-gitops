namespace: stock-alert

workload:
  name: api-gateway

  replicas: 1

  image:
    repository: ghcr.io/rakeshh1990/stock-alert-api-gateway
    tag: latest
    pullPolicy: Always

  containerPort: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi


service:
  enabled: true

  type: ClusterIP

  ports:
    - name: http
      port: 8000
      targetPort: 8000


ingress:
  enabled: false


configMap:
  enabled: true

  data:

    AUTH_SERVICE_URL: http://auth-service:8001

    USER_SERVICE_URL: http://user-service:8002

    ANALYZER_SERVICE_URL: http://analyzer-service:8003

    SCANNER_SERVICE_URL: http://scanner-service:8004

    NOTIFIER_SERVICE_URL: http://notifier-service:8005


secret:
  enabled: true


probes:
  enabled: true


  startupProbe:
    httpGet:
      path: /health
      port: 8000

    failureThreshold: 30
    periodSeconds: 10


  readinessProbe:
    httpGet:
      path: /health
      port: 8000

    periodSeconds: 10


  livenessProbe:
    httpGet:
      path: /health
      port: 8000

    initialDelaySeconds: 30
    periodSeconds: 30